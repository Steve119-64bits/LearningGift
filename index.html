<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f57a37"><title>K2 BMK 7.4 TEMPAT</title><style>
:root{--b:#673d2c;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-family:"Arial Rounded MT Bold","Comic Sans MS",Arial,sans-serif;background:#74d4ff;user-select:none}.game{position:fixed;inset:0;height:100dvh;background:linear-gradient(#8fd8ff 0 56%,#8cde79 56%)}.top{position:absolute;inset:0 0 auto;height:12dvh;min-height:75px;padding:6px 10px;display:grid;grid-template-columns:1fr 1fr 2.2fr 1fr;gap:8px;align-items:center;background:linear-gradient(#ffb543,#f47735);border-bottom:6px solid #82452f;z-index:5}.title{text-align:center;color:#fff;font-size:clamp(22px,3vw,48px);font-weight:900;text-shadow:0 4px #b94e2f}.info{min-width:0;padding:4px;text-align:center;white-space:nowrap;background:#fff3d6;border:4px solid var(--b);border-radius:16px;font-size:clamp(13px,1.5vw,22px);font-weight:900}.info b{color:#e54f2e;font-size:clamp(21px,2.5vw,40px)}.tent{position:absolute;top:12dvh;left:3vw;width:94vw;height:15dvh;background:repeating-linear-gradient(90deg,#ff9c40 0 12vw,#e85f3b 12vw 24vw);clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);border-bottom:7px solid #82432f}.q{position:absolute;top:18dvh;left:50%;transform:translateX(-50%);width:min(72vw,1000px);min-height:16dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#fff8dc,#ffd993);border:6px solid var(--b);border-radius:28px;box-shadow:0 8px #0002;z-index:3}.q small{font-size:clamp(13px,1.4vw,24px);font-weight:900;color:#8f4c31}.q strong{font-size:clamp(48px,7vw,105px);line-height:1;color:#d9472f;text-shadow:0 4px #fff1d0}.stage{position:absolute;top:37dvh;left:3vw;width:94vw;height:48dvh;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:linear-gradient(#f7cd68,#efa343);border:8px solid var(--b);border-radius:30px;box-shadow:0 11px #0003}.option{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;touch-action:manipulation;cursor:pointer}.bottle{position:relative;width:clamp(62px,8vw,100px);height:clamp(95px,13vw,145px);border:6px solid #754434;border-radius:20px 20px 25px 25px;background:linear-gradient(90deg,#ffffff77,var(--c));box-shadow:inset -12px -10px #0002,0 6px #0003;transform-origin:50% 90%}.bottle:before{content:"";position:absolute;left:30%;top:-31%;width:28%;height:33%;border:inherit;border-bottom:0;border-radius:8px 8px 0 0;background:var(--c)}.bottle:after{content:"";position:absolute;left:15%;top:20%;width:24%;height:40%;border-radius:12px;background:#ffffff66}.word{width:100%;max-width:180px;margin-top:8px;padding:7px 3px;background:#fffdf4;border:4px solid #684032;border-radius:13px;box-shadow:0 4px #0002;color:#211;font-size:clamp(18px,2.3vw,36px);font-weight:900}.option:active .bottle{transform:scale(.9)}.msg{position:absolute;bottom:calc(1dvh + var(--safe));left:50%;transform:translateX(-50%);width:min(78vw,1000px);min-height:8dvh;padding:6px 12px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(#ff9953,#e85d36);border:6px solid var(--b);border-radius:22px;font-size:clamp(16px,2.2vw,34px);font-weight:900;text-shadow:0 3px #a43f2d;z-index:4}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#261914cc;z-index:20}.panel{width:min(760px,92vw);max-height:90dvh;overflow:auto;padding:clamp(22px,5vw,46px);text-align:center;background:#fff5d5;border:8px solid var(--b);border-radius:34px;box-shadow:0 16px #0004}.panel h1{margin:0 0 12px;color:#e65332;font-size:clamp(38px,8vw,78px);line-height:1}.panel p{font-size:clamp(18px,3.7vw,31px);line-height:1.5}.btn{min-height:62px;padding:14px 42px;border:0;border-bottom:8px solid #8d3f28;border-radius:22px;background:linear-gradient(#ffb242,#ff7435);color:#fff;font-size:clamp(26px,5vw,44px);font-weight:900;text-shadow:0 4px #a9442b;touch-action:manipulation}.btn:active{transform:translateY(4px);border-bottom-width:4px}.tip{margin-top:12px;color:#7d5c4e;font-size:clamp(14px,3vw,20px)}.hidden{display:none!important}.shake{animation:shake .42s}.smash{animation:smash .5s forwards}@keyframes shake{20%{transform:rotate(-14deg)}40%{transform:rotate(13deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(8deg)}}@keyframes smash{35%{transform:scale(1.2) rotate(8deg)}to{transform:scale(0) rotate(200deg);opacity:0}}.float{position:fixed;z-index:30;pointer-events:none;color:#fff;font-size:clamp(44px,8vw,88px);font-weight:900;text-shadow:0 5px #d24729,0 0 18px #fff36e;animation:up .85s forwards}@keyframes up{from{opacity:0;transform:translate(-50%,-20%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}to{opacity:0;transform:translate(-50%,-150%) scale(.8)}}.spark{position:fixed;z-index:30;pointer-events:none;font-size:32px;animation:fly .8s forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}.badge{position:absolute;right:2vw;top:14dvh;display:none;z-index:8;padding:8px 14px;border:4px solid #7b3828;border-radius:18px;background:linear-gradient(#fff177,#ff9b34);color:#d63d25;font-size:clamp(18px,2.5vw,40px);font-weight:900;box-shadow:0 6px #0002}.flash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:25;text-align:center;color:#fff;background:radial-gradient(circle,#fff569dd,#ff7f2dbb,#592214dd);font-size:clamp(44px,9vw,120px);font-weight:900;text-shadow:0 7px #b63d26,0 0 25px #fff36a}
@media(orientation:portrait),(max-width:700px){.top{height:18dvh;min-height:112px;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:4px;padding:4px 6px}.title{grid-column:1/-1;grid-row:1;font-size:clamp(22px,6vw,34px)}.info{font-size:clamp(12px,3.1vw,16px);border-width:3px;border-radius:12px;padding:2px}.info b{font-size:clamp(19px,5vw,27px)}.tent{top:18dvh;height:11dvh}.q{top:22dvh;width:85vw;min-height:13dvh;border-width:4px;border-radius:21px}.q small{font-size:clamp(12px,3.2vw,16px)}.q strong{font-size:clamp(42px,15vw,72px)}.stage{top:37dvh;height:49dvh;padding:7px;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:7px;border-width:5px;border-radius:21px}.bottle{width:clamp(51px,14vw,70px);height:clamp(75px,20vw,100px);border-width:4px}.word{margin-top:4px;max-width:145px;padding:4px 2px;border-width:3px;font-size:clamp(17px,5.1vw,24px)}.msg{width:90vw;font-size:clamp(15px,4.1vw,20px);border-width:4px;border-radius:15px}.badge{top:19dvh;font-size:15px;padding:5px 8px}}
@media(orientation:landscape) and (max-height:520px){.top{height:16dvh;min-height:58px;padding:3px 6px}.title{font-size:clamp(18px,3.5vw,30px)}.info{font-size:11px;border-width:3px;padding:1px}.info b{font-size:clamp(18px,3vw,26px)}.tent{top:16dvh;height:13dvh}.q{top:20dvh;min-height:15dvh;width:65vw;border-width:4px}.q strong{font-size:clamp(38px,7vw,66px)}.stage{top:38dvh;height:47dvh;padding:5px 8px;gap:6px;border-width:5px}.bottle{width:clamp(47px,7vw,70px);height:clamp(68px,11vw,100px);border-width:4px}.word{margin-top:3px;padding:3px 2px;border-width:3px;font-size:clamp(15px,2.3vw,23px)}.msg{font-size:clamp(14px,2.3vw,22px);border-width:4px}.badge{top:17dvh;font-size:15px;padding:5px 8px}}
</style></head><body><main class="game"><header class="top"><div class="info">⭐ 分数 <b id="score">0</b></div><div class="info">🔥 连击 <b id="combo">0/3</b></div><div class="title">🎪 Tempat｜打瓶子挑战</div><div class="info">⏰ 时间 <b id="time">20</b></div></header><div class="tent"></div><section class="q"><small>看中文，触碰正确的马来文地点</small><strong id="question">屋子</strong></section><section class="stage" id="stage"></section><div class="badge" id="badge">🔥 DOUBLE ×2</div><div class="msg" id="msg">准备好了吗？触碰正确答案！</div></main><div class="flash" id="flash">🔥 DOUBLE ×2</div><div class="overlay" id="start"><div class="panel"><h1>🎯 打瓶子挑战</h1><p>看中文题目，触碰正确的马来文地点。<br>答对 1 题得 1 分；连续答对 3 题后开启双倍分数！</p><button class="btn" id="startBtn">开始游戏</button><div class="tip">📱 手机可直屏或横屏玩，不需要鼠标。</div></div></div><div class="overlay hidden" id="end"><div class="panel"><h1>⏰ 挑战结束！</h1><p id="result"></p><button class="btn" id="again">再玩一次</button></div></div><script>
const Q=[{q:"屋子",a:"rumah"},{q:"厨房",a:"dapur"},{q:"公园",a:"taman"},{q:"操场",a:"padang"}],W=Q.map(x=>x.a),C=["#55c8d3","#ffb037","#a96bda","#81c64a"],$=id=>document.getElementById(id);let order=[],i=0,score=0,time=20,streak=0,dbl=false,lock=false,timer,ctx;function shuffle(a){a=[...a];for(let x=a.length-1;x;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function audio(){try{ctx=ctx||new(AudioContext||webkitAudioContext);if(ctx.state==="suspended")ctx.resume();return ctx}catch(e){return null}}function start(){clearInterval(timer);audio();order=shuffle(Q);i=score=streak=0;time=20;dbl=lock=false;$("score").textContent=0;$("time").textContent=20;$("combo").textContent="0/3";$("badge").style.display="none";$("start").classList.add("hidden");$("end").classList.add("hidden");render();timer=setInterval(()=>{time--;$("time").textContent=time;if(time<=0)finish()},1000)}function render(){lock=false;if(i>=order.length){order=shuffle(Q);i=0}$("question").textContent=order[i].q;$("msg").textContent=`当前分数：${score}｜触碰正确答案！`;let s=$("stage");s.innerHTML="";shuffle(W).forEach((w,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<div class="bottle" style="--c:${C[n]}"></div><div class="word">${w}</div>`;b.onpointerup=e=>{e.preventDefault();choose(w,b,e)};s.appendChild(b)})}function choose(w,b,e){if(lock)return;let r=b.getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;if(w===order[i].a){lock=true;streak++;if(streak>=3&&!dbl){dbl=true;bonus()}let g=dbl?2:1;score+=g;$("score").textContent=score;$("combo").textContent=dbl?"MAX":`${streak}/3`;b.classList.add("smash");$("msg").textContent=dbl?"🔥 DOUBLE！答对 +2 分":"✅ 答对了！+1 分";float(g,x,y);burst(x,y);beep(1);setTimeout(()=>{i++;render()},420)}else{b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$("msg").textContent="再试试看！答错不扣分。";beep(0)}}function beep(ok){let c=audio();if(!c)return;let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?760:180;o.type=ok?"sine":"sawtooth";g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.start();o.stop(c.currentTime+.22)}function float(n,x,y){let d=document.createElement("div");d.className="float";d.textContent=`+${n}`;d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),900)}function burst(x,y){for(let n=0;n<14;n++){let d=document.createElement("div");d.className="spark";d.textContent=["✨","⭐","💥","🎉"][Math.floor(Math.random()*4)];d.style.left=x+"px";d.style.top=y+"px";d.style.setProperty("--x",Math.random()*260-130+"px");d.style.setProperty("--y",Math.random()*-200-20+"px");document.body.appendChild(d);setTimeout(()=>d.remove(),850)}}function bonus(){$("badge").style.display="block";$("flash").style.display="flex";setTimeout(()=>$("flash").style.display="none",900)}function finish(){clearInterval(timer);lock=true;let stars=score>=14?"⭐⭐⭐⭐⭐":score>=10?"⭐⭐⭐⭐":score>=6?"⭐⭐⭐":"⭐⭐";$("result").innerHTML=`${stars}<br><br>你的分数：<b style="font-size:1.7em;color:#e65332">${score}</b><br>触碰得越快，分数越高！${dbl?"<br>🔥 你成功开启了 DOUBLE ×2！":""}`;$("end").classList.remove("hidden")}$("startBtn").onclick=start;$("again").onclick=start;document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
</script></body></html>
